wechat_official_account_config:
  oauth:
    app_id: "your_wechat_app_id"
    app_secret: "your_wechat_app_secret"
  base_uri: "https://api.weixin.qq.com"
  proxy_uri: ""
  timeout: 5.0
  http_debug: true
  component_app_id: "your_component_app_id"
  component_app_token: "your_component_app_token"

byte_dance_douyin_config:
  base_uri: "https://open.douyin.com"
  proxy_uri: ""
  http_debug: false
  timeout: 5.0
  oauth:
    app_id: "your_douyin_app_id"
    app_secret: "your_douyin_app_secret"

redbook_juguang_config:
  base_uri: "https://www.xiaohongshu.com"
  proxy_uri: ""
  timeout: 5.0
  http_debug: false
  oauth:
    app_id: "your_redbook_app_id"
    app_secret: "your_redbook_app_secret"

google_youtube_config:
  api_url: "https://www.googleapis.com"
  proxy_api_url: ""
  timeout: 15
  http_debug: false
  oauth:
    access_token_url: "https://oauth2.googleapis.com/token"
    proxy_access_token_url: ""
    client_id: "your_google_client_id.apps.googleusercontent.com"
    client_secret: "your_google_client_secret"
    redirect_url: "http://localhost"
    scope: "https://www.googleapis.com/auth/youtube.force-ssl"
    refresh_token: "your_refresh_token_if_any"
    access_token: ""   # 可填入临时 AccessToken；也可以通过环境变量提供
    token_expiry: 0

zhihu_config:
  sessionToken:
    strategy: zhihu_pc_v1
    service:
      base_url: "http://127.0.0.1:7070"
      api_token: "dev-session-token"
      timeout: 30
      http_debug: false
      api_version: "v4"
    authenticator:
      entries:
        - type: pc
          url: "https://www.zhihu.com/signin?next=%2F"
      default_user_agent: "Mozilla/5.0 (Macintosh; Intel Mac OS X 14_3) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/123.0.6312.58 Safari/537.36"
      script_ids:
        - "sessiontoken.zhihu.auth.pc.v1"
      captcha_strategy: "auto"
    harvester:
      watch_cookies:
        - SESSIONID
        - JOID
        - osd
        - q_c1
        - d_c0
        - unlock_ticket
        - z_c0
      watch_headers:
        - X-XSRF-TOKEN
      harvest_script_id: "sessiontoken.zhihu.harvest.pc.v1"
    callback:
      secret: "mediax-sessiontoken-callback"
      max_retry: 3
      retry_backoff: [2, 4, 8]
    network:
      proxy: ""
      proxy_pool: "zhihu-default"
      ip_strategy: "china_rotating"
      request_timeout: 60
    api:
      retry_backoff: [2, 4, 8]
