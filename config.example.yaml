access_token_providers:
  providers:
    - code: "google"
      name: "Google"
      apps:
        - code: "youtube"
          name: "Google YouTube"
          provider_code: "google_youtube"
          api_version: "v3"
          auth_modes:
            - key: "default"
              label: "默认 OAuth"
              google_youtube_config:
                api_url: "https://www.googleapis.com"
                proxy_api_url: ""
                timeout: 15            # 请求超时时间（秒）
                http_debug: false      # 是否打印 HTTP 请求/响应
                oauth:
                  access_token_url: "https://oauth2.googleapis.com/token"
                  proxy_access_token_url: ""
                  client_id: "${GOOGLE_YOUTUBE_CLIENT_ID}"            # 推荐通过环境变量注入
                  client_secret: "${GOOGLE_YOUTUBE_CLIENT_SECRET}"
                  redirect_url: "http://localhost:7071/debug/callback"
                  scope: "https://www.googleapis.com/auth/youtube.force-ssl"
                  refresh_token: "${GOOGLE_YOUTUBE_REFRESH_TOKEN}"
                  access_token: "${GOOGLE_YOUTUBE_ACCESS_TOKEN}"   # 可填入临时 AccessToken；也可以通过环境变量提供
                  token_expiry: 0
                oauth_key: "default"    # 映射 token 仓库或租户标识
        - code: "blogger"
          name: "Google Blogger"
          provider_code: "google_blogger"
          api_version: "v3"
          auth_modes:
            - key: "default"
              label: "默认 OAuth"
              google_blogger_config:
                api_url: "https://www.googleapis.com"
                proxy_api_url: ""
                timeout: 15
                http_debug: false
                oauth:
                  access_token_url: "https://oauth2.googleapis.com/token"
                  proxy_access_token_url: ""
                  client_id: "${GOOGLE_BLOGGER_CLIENT_ID}"
                  client_secret: "${GOOGLE_BLOGGER_CLIENT_SECRET}"
                  redirect_url: "http://localhost:7071/debug/callback"
                  scope: "https://www.googleapis.com/auth/blogger"
                  refresh_token: "${GOOGLE_BLOGGER_REFRESH_TOKEN}"
                  access_token: "${GOOGLE_BLOGGER_ACCESS_TOKEN}"
                  token_expiry: 0
                oauth_key: "default"
    - code: "byte_dance"
      name: "字节跳动"
      apps:
        - code: "default"                       # Flow key `<app>` 固定 default，避免误解支持多 App
          app_key: "douyin"                     # UI/CLI 展示/上报的 provider_app，可保持 "douyin" 便于辨识
          name: "抖音 Douyin"
          provider_code: "byte_dance_douyin"
          api_version: "v1"
          auth_modes:
            - key: "default"
              label: "默认 OAuth"
              byte_dance_douyin_config:
                api_url: "https://open.douyin.com"
                proxy_api_url: ""
                timeout: 5.0
                http_debug: false
                oauth:
                  oauth_url: "${DOUYIN_OAUTH_URL:-https://open.douyin.com/platform/oauth/connect}"          # 授权页 URL（必须 https）
                  access_token_url: "${DOUYIN_ACCESS_TOKEN_URL:-https://open.douyin.com/oauth/access_token/}" # 交换 code 的 URL
                  client_id: "${DOUYIN_CLIENT_ID}"                                                           # 推荐通过环境变量注入 client_key
                  client_secret: "${DOUYIN_CLIENT_SECRET}"                                                   # 推荐通过环境变量注入 client_secret
                  redirect_url: "${DOUYIN_REDIRECT_URL:-http://127.0.0.1:7071/debug/callback}"               # 回调地址
                  scope: "${DOUYIN_SCOPE:-video.list,im.message.send}"                                       # 授权范围
                oauth_key: "${DOUYIN_OAUTH_KEY:-default}"                                                    # 用于 Flow/Tokens 标识租户
    - code: "redbook"
      name: "小红书"
      apps:
        - code: "juguang"
          name: "小红书聚光"
          provider_code: "redbook_juguang"
          api_version: "v1"
          auth_modes:
            - key: "default"
              label: "默认 OAuth"
              redbook_juguang_config:
                api_url: "https://adapi.xiaohongshu.com"
                proxy_api_url: ""
                timeout: 5.0
                http_debug: false
                oauth:
                  oauth_url: "${REDBOOK_JUGUANG_OAUTH_URL:-https://ad.xiaohongshu.com/oauth2/authorize}"
                  access_token_url: "${REDBOOK_JUGUANG_ACCESS_TOKEN_URL:-https://ad.xiaohongshu.com/oauth2/access_token}"
                  client_id: "${REDBOOK_JUGUANG_CLIENT_ID}"             # 建议均由环境变量注入
                  client_secret: "${REDBOOK_JUGUANG_CLIENT_SECRET}"
                  redirect_url: "${REDBOOK_JUGUANG_REDIRECT_URL:-http://127.0.0.1:7071/debug/callback}"
                  scope: "${REDBOOK_JUGUANG_SCOPE:-notes.read,notes.write}"
                oauth_key: "${REDBOOK_JUGUANG_OAUTH_KEY:-default}"
    - code: "bilibili"
      name: "哔哩哔哩"
      apps:
        - code: "default"
          name: "Bilibili"
          provider_code: "bilbili"
          api_version: "v1"
          auth_modes:
            - key: "default"
              label: "默认"
              bilibili_config:
                api_url: "https://member.bilibili.com"
                proxy_api_url: ""
                timeout: 5.0
                http_debug: false
                oauth:
                  client_id: "your_bilibili_app_id"
                  client_secret: "your_bilibili_app_secret"

client_token_providers:
  providers:
    - code: "wechat"
      name: "微信"
      apps:
        - code: "official_account"
          name: "公众号"
          provider_code: "wechat_official_account"
          auth_modes:
            - key: "default"
              label: "默认"
              wechat_official_account_config:
                api_url: "https://api.weixin.qq.com"
                proxy_api_url: ""
                timeout: 5.0
                http_debug: true
                oauth:
                  client_id: "your_wechat_app_id"
                  client_secret: "your_wechat_app_secret"
                client_token:
                  appid: "your_wechat_app_id"
                  appsecret: "your_wechat_app_secret"
                  message_token: "${WECHAT_OFFICIAL_MESSAGE_TOKEN}"
                  message_aes_key: "${WECHAT_OFFICIAL_MESSAGE_AES_KEY}"
                api_token: "${WECHAT_CLIENTTOKEN_API_TOKEN:-dev-clienttoken}"
                cache:
                  redis_key: "clientToken:wechat:your_wechat_app_id"
                  ttl_seconds: 7000
                  refresh_before_seconds: 600
                redis:
                  addr: "${WECHAT_CLIENTTOKEN_REDIS_ADDR:-127.0.0.1:6379}"
                  db: "${WECHAT_CLIENTTOKEN_REDIS_DB:-0}"

session_token_providers:
  providers:
    - code: "zhihu"
      name: "知乎"
      apps:
        - code: "web"
          name: "知乎 Web"
          provider_code: "zhihu_sessiontoken"
          auth_modes:
            - key: "default"
              label: "默认"
              zhihu_session_token_config:
                strategy: zhihu_pc_v1
                service:
                  base_url: "http://127.0.0.1:7070"
                  api_token: "dev-session-token"
                  timeout: 30
                  http_debug: false
                  api_version: "v4"
                authenticator:
                  entries:
                    - type: pc
                      url: "https://www.zhihu.com/signin?next=%2F"
                  default_user_agent: "Mozilla/5.0 (Macintosh; Intel Mac OS X 14_3) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/123.0.6312.58 Safari/537.36"
                  script_ids:
                    - "sessiontoken.zhihu.auth.pc.v1"
                  captcha_strategy: "auto"
                harvester:
                  watch_cookies:
                    - SESSIONID
                    - JOID
                    - osd
                    - q_c1
                    - d_c0
                    - unlock_ticket
                    - z_c0
                  watch_headers:
                    - X-XSRF-TOKEN
                  harvest_script_id: "sessiontoken.zhihu.harvest.pc.v1"
                callback:
                  secret: "mediax-sessiontoken-callback"
                  max_retry: 3
                  retry_backoff: [2, 4, 8]
                network:
                  proxy: ""
                  proxy_pool: "zhihu-default"
                  ip_strategy: "china_rotating"
                  request_timeout: 60
                api:
                  retry_backoff: [2, 4, 8]
